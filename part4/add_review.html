<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB - Add Review</title>
  <link rel="icon" href="images/icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body data-page="add-review">
  <header class="site-header">
    <img src="images/logo.png" class="logo" alt="HBnB Logo">
    <nav class="main-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="login.html" data-auth-link="true">Login</a>
    </nav>
    <a href="login.html" id="login-link" class="login-button">Login</a>
    <button id="logout-link" class="login-button logout-button" data-logout-link="true" type="button" style="display:none;"><span data-user-label="true"></span>Logout</button>
  </header>

  <main>
    <section class="review-page">
      <h1 id="add-review-title">Add a Review</h1>
      <form id="review-form" class="form">
        <label for="review-text">Your Review:</label>
        <textarea id="review-text" required></textarea>

        <label for="review-rating">Rating:</label>
        <select id="review-rating">
          <option value="1">1 Star</option>
          <option value="2">2 Stars</option>
          <option value="3">3 Stars</option>
          <option value="4">4 Stars</option>
          <option value="5">5 Stars</option>
        </select>

        <button type="submit">Submit Review</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 HBnB. All rights reserved.</p>
  </footer>
</body>
</html>
