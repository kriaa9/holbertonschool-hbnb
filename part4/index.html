<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB - Available Places</title>
  <link rel="icon" href="images/icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body data-page="index">
  <header class="site-header">
    <img src="images/logo.png" class="logo" alt="HBnB Logo">
    <nav class="main-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="login.html" data-auth-link="true">Login</a>
    </nav>
    <a href="login.html" id="login-link" class="login-button">Login</a>
    <button id="logout-link" class="login-button logout-button" data-logout-link="true" type="button" style="display:none;"><span data-user-label="true"></span>Logout</button>
  </header>

  <main>
    <section class="hero">
      <h1>Available Places</h1>
    </section>

    <section id="filter" class="filter-row">
      <h2 class="visually-hidden">Filter Places</h2>
      <label for="price-filter">Max price per night:</label>
      <select id="price-filter"></select>
    </section>

    <section id="places-list" class="places-list" aria-live="polite">
      <h2 class="visually-hidden">Place Results</h2>
    </section>
  </main>

  <footer>
    <p>© 2026 HBnB. All rights reserved.</p>
  </footer>
</body>
</html>
