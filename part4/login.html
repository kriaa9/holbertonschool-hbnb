<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB - Login</title>
  <link rel="icon" href="images/icon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="scripts.js" defer></script>
</head>
<body data-page="login">
  <header class="site-header">
    <img src="images/logo.png" class="logo" alt="HBnB Logo">
    <nav class="main-nav" aria-label="Primary">
      <a href="index.html">Home</a>
      <a href="login.html" data-auth-link="true">Login</a>
    </nav>
    <a href="login.html" id="login-link" class="login-button">Login</a>
    <button id="logout-link" class="login-button logout-button" data-logout-link="true" type="button" style="display:none;"><span data-user-label="true"></span>Logout</button>
  </header>

  <main>
    <section class="auth-section">
      <h1>Login</h1>
      <div id="login-error" class="error-message" role="alert" aria-live="assertive"></div>
      <form id="login-form" class="form" novalidate>
        <label for="email">Email:</label>
        <input type="email" id="email" required>

        <label for="password">Password:</label>
        <input type="password" id="password" required>

        <button type="submit">Login</button>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2026 HBnB. All rights reserved.</p>
  </footer>
</body>
</html>
